[package]
name = "migrate-doctor"
version = "0.1.0"
edition = "2021"
description = "Minimal PostgreSQL migration safety linter (MVP)"
license = "MIT"

[[bin]]
name = "migrate-doctor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.54"
toml = "0.8"
walkdir = "2.5"
